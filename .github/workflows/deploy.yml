# 배포: develop → dev.guruguru.app (development) · main → guruguru.app (production)
# Environment secrets: DEPLOY_SSH_KEY (환경별 전용 키, 서버에서 rrsync 로 해당 폴더에만 쓰기 가능)
#                      API_DEPLOY_SSH_KEY (API 코드 폴더 전용 rrsync 키)
# Environment vars:    GOOGLE_CLIENT_ID, ADMIN_EMAILS (로그인 백엔드 설정)
# Repository secrets:  DEPLOY_HOST, DEPLOY_USER, DEPLOY_KNOWN_HOSTS
name: Deploy

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 배포 대상
        type: choice
        options: [development, production]
        default: development

concurrency:
  group: deploy-${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
      url: ${{ (github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'development')) == 'production' && 'https://guruguru.app' || 'https://dev.guruguru.app' }}
    env:
      TARGET: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'production' || 'development') }}
    steps:
      - name: Guard (production 은 main 에서만)
        if: env.TARGET == 'production' && github.ref_name != 'main'
        run: echo "::error::production 은 main 브랜치에서만 배포할 수 있습니다" && exit 1

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build & check
        run: |
          ENV=$([ "$TARGET" = production ] && echo prod || echo dev)
          VER=${GITHUB_SHA::8}
          echo "BUILD_ID=$ENV-$VER" >> "$GITHUB_ENV"
          node scripts/build.mjs --env=$ENV --version=$VER
          node scripts/check.mjs

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy (rsync → server)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -rlptz --delete --omit-dir-times \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            dist/ "$DEPLOY_USER@$HOST:/"

      - name: Deploy API (server/ → ~/apps/guruguru-api/<env>/code, 키가 있을 때만)
        env:
          API_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
        run: |
          if [ -z "$API_KEY" ]; then echo "API_DEPLOY_SSH_KEY 없음 — API 배포 건너뜀"; exit 0; fi
          export ORIGINS=$([ "$TARGET" = production ] && echo https://guruguru.app || echo https://dev.guruguru.app)
          mkdir -p api-out && cp server/server.mjs api-out/
          node -e 'const e=process.env;require("fs").writeFileSync("api-out/config.json",JSON.stringify({GOOGLE_CLIENT_ID:e.GOOGLE_CLIENT_ID||"",ADMIN_EMAILS:e.ADMIN_EMAILS||"",ORIGINS:e.ORIGINS},null,1))'
          [ -n "$GOOGLE_CLIENT_ID" ] || echo "::warning::GOOGLE_CLIENT_ID 변수가 없어 로그인이 꺼진 상태로 배포됩니다"
          printf '%s\n' "$API_KEY" > ~/.ssh/api_key && chmod 600 ~/.ssh/api_key
          rsync -rlptz --omit-dir-times \
            -e "ssh -i ~/.ssh/api_key -o IdentitiesOnly=yes -o BatchMode=yes" \
            api-out/ "$DEPLOY_USER@$HOST:/"
          sleep 4

      - name: Smoke test
        run: |
          URL=$([ "$TARGET" = production ] && echo https://guruguru.app || echo https://dev.guruguru.app)
          node scripts/smoke.mjs "$URL" "$BUILD_ID"

      - name: Summary
        if: always()
        run: |
          echo "### ${TARGET} · \`${BUILD_ID:-?}\` · ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${GITHUB_SHA::8} by ${{ github.actor }}" >> "$GITHUB_STEP_SUMMARY"

      # main 에 hotfix 가 직접 들어간 경우 등 develop 이 뒤처지면 맞춰 준다
      - name: Sync main → develop
        if: success() && env.TARGET == 'production' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code --heads origin develop >/dev/null; then git push origin HEAD:develop; echo "develop created from main"; exit 0; fi
          git fetch origin develop
          if git merge-base --is-ancestor origin/develop HEAD; then
            if [ "$(git rev-parse origin/develop)" != "$(git rev-parse HEAD)" ]; then
              git push origin HEAD:develop && echo "develop fast-forwarded to main"
            fi
          elif ! git merge-base --is-ancestor HEAD origin/develop; then
            gh pr list --base develop --head main --state open --json number --jq 'length' | grep -q '^0$' && \
              gh pr create --base develop --head main --title "chore: sync main → develop" --body "main 에만 있는 변경(hotfix 등)을 develop 에 반영합니다." || true
          fi
