# PR 검증: 빌드 + 정적 검사. main 으로 가는 PR 은 develop / hotfix/* / release/* 에서만 허용.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: ['feature/**', 'fix/**', 'hotfix/**', 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Branch policy
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          case "${{ github.head_ref }}" in
            develop|hotfix/*|release/*) echo "ok: ${{ github.head_ref }} → main" ;;
            *) echo "::error::main 으로는 develop, hotfix/*, release/* 브랜치만 PR 할 수 있습니다 (현재: ${{ github.head_ref }})"; exit 1 ;;
          esac
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build (prod)
        run: node scripts/build.mjs --env=prod
      - name: Check
        run: node scripts/check.mjs
      - name: Build (dev)
        run: node scripts/build.mjs --env=dev && node scripts/check.mjs
