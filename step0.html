<style>
:root{
  --bg:#faf6ef;--bg2:#f3ede2;--card:#fff;--ink:#1b1d24;--ink2:#5a5d68;--ink3:#8b8d96;--line:#e7e0d3;
  --red:#d4473d;--red-soft:#fbe7e3;--jade:#2f8f7f;--jade-soft:#dff1ec;--indigo:#3b4fa0;--indigo-soft:#e4e8f7;--gold:#c8952e;--gold-soft:#f8eed8;

  --shadow:0 1px 2px rgba(27,29,36,.04),0 8px 24px -8px rgba(27,29,36,.10);
  --shadow-lg:0 2px 4px rgba(27,29,36,.04),0 24px 48px -16px rgba(27,29,36,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14161c;--bg2:#1a1d25;--card:#1f232c;--ink:#f1efe9;--ink2:#b3b5bd;--ink3:#80838d;--line:#2d313c;
  --red:#ef6a5f;--red-soft:#3a2224;--jade:#4fbfaa;--jade-soft:#1b332f;--indigo:#8a9cf0;--indigo-soft:#232a45;--gold:#e2b55a;--gold-soft:#372e1c;
  --ok:#5fcf8f;--ok-soft:#1b3326;--ng:#f07a70;--ng-soft:#3a2224;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -8px rgba(0,0,0,.5);--shadow-lg:0 24px 48px -16px rgba(0,0,0,.6);}}
:root[data-theme="dark"]{
  --bg:#14161c;--bg2:#1a1d25;--card:#1f232c;--ink:#f1efe9;--ink2:#b3b5bd;--ink3:#80838d;--line:#2d313c;
  --red:#ef6a5f;--red-soft:#3a2224;--jade:#4fbfaa;--jade-soft:#1b332f;--indigo:#8a9cf0;--indigo-soft:#232a45;--gold:#e2b55a;--gold-soft:#372e1c;
  --ok:#5fcf8f;--ok-soft:#1b3326;--ng:#f07a70;--ng-soft:#3a2224;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -8px rgba(0,0,0,.5);--shadow-lg:0 24px 48px -16px rgba(0,0,0,.6);}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans KR",system-ui,sans-serif;line-height:1.75;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[lang="ko"]{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@media(min-width:768px){.wrap{padding:0 32px}}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:12px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;white-space:nowrap;min-width:0}
.logo span:last-child{overflow:hidden;text-overflow:ellipsis}
.logo-mark{flex-shrink:0}
@media(max-width:420px){.nav{gap:8px}.back{padding:7px 10px;font-size:12px}}
.logo-mark{width:32px;height:32px;border-radius:10px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:"Noto Serif KR",serif;font-weight:900;font-size:17px}
.back{margin-left:auto;font-size:13px;color:var(--ink2);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);white-space:nowrap}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;flex-shrink:0}
.lnav{display:flex;gap:6px;overflow-x:auto;padding:0 20px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:1120px;margin:0 auto}
@media(min-width:768px){.lnav{padding:0 32px 12px}}
.lnav::-webkit-scrollbar{display:none}
.lnav button{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:6px 12px 6px 6px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer;transition:.2s}
.lnav button i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);font-size:11px}
.lnav button.done i{background:var(--ok);color:#fff}
.lnav button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lnav button[aria-current="true"] i{background:var(--red);color:#fff}

.hero{padding-top:40px;padding-bottom:8px}
@media(min-width:768px){.hero{padding-top:64px;padding-bottom:16px}}
.crumb{font-size:13px;color:var(--red);font-weight:700;letter-spacing:.06em}
.hero h1{font-size:clamp(28px,5.6vw,46px);font-weight:900;line-height:1.3;letter-spacing:-.015em;margin:8px 0 12px}
.hero p{color:var(--ink2);max-width:640px}
.overview{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:24px}
@media(min-width:768px){.overview{grid-template-columns:repeat(4,1fr);gap:12px}}
.ov{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;transition:.2s;box-shadow:var(--shadow)}
.ov:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ov small{font-size:11px;color:var(--ink3);font-weight:700}
.ov b{display:block;font-size:14px;line-height:1.45}
.ov.cur{border-color:var(--red);box-shadow:0 0 0 2px var(--red-soft)}

main{padding:24px 0 80px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow-lg);overflow:hidden}
.lhead{padding:28px 22px 24px;background:linear-gradient(135deg,var(--red-soft),transparent 65%);border-bottom:1px solid var(--line);position:relative}
@media(min-width:768px){.lhead{padding:40px 44px 32px}}
.lhead .no{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--red)}
.lhead h2{font-size:clamp(24px,4.4vw,36px);font-weight:900;line-height:1.35;margin:6px 0 4px}
.lhead .sub{color:var(--ink2)}
.lhead .big{position:absolute;right:20px;top:10px;font-family:"Noto Serif KR",serif;font-weight:900;font-size:clamp(64px,14vw,120px);line-height:1;color:var(--red);opacity:.12;pointer-events:none}
.goals{display:grid;gap:8px;margin-top:18px}
.goal{display:flex;gap:10px;align-items:flex-start;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.goal::before{content:"🎯";font-size:14px;line-height:1.75}
.lbody{padding:8px 22px 28px}
@media(min-width:768px){.lbody{padding:12px 44px 40px}}
.sec{padding:26px 0;border-bottom:1px dashed var(--line)}
.sec:last-child{border-bottom:0}
.sec h3{font-size:18px;font-weight:900;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.sec h3 .n{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:var(--bg);font-size:13px}
.sec .desc{color:var(--ink2);font-size:14px;margin:-6px 0 14px}

/* flow */
.timebar{display:flex;height:40px;border-radius:12px;overflow:hidden;gap:3px;margin-bottom:12px}
.timebar div{display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;min-width:0}
.flow{display:grid;gap:8px}
.fi{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg2);align-items:start}
.fi .t{font-size:12px;font-weight:700;color:var(--ink3);padding-top:3px;display:flex;align-items:center;gap:6px}
.fi .t i{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.fi b{display:block;font-size:15px}
.fi p{font-size:14px;color:var(--ink2)}

/* letters */
.letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.lt{position:relative;background:var(--bg2);border-radius:16px;padding:14px 8px 12px;text-align:center;border:1px solid transparent;cursor:pointer;transition:.2s}
.lt:hover{border-color:var(--red);transform:translateY(-2px)}
.lt:active{transform:scale(.97)}
.lt .k{font-family:"Noto Serif KR",serif;font-size:36px;font-weight:700;line-height:1.15;color:var(--ink)}
.lt .s{font-size:14px;font-weight:700;margin-top:2px}
.lt .r{font-size:12px;color:var(--ink3);line-height:1.4;margin-top:2px}
.lt .sp{position:absolute;right:8px;top:8px;font-size:11px;opacity:.45}
.grp-label{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:.06em;margin:18px 0 10px}
.grp-label:first-child{margin-top:0}

/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:max-content;font-size:15px}
th,td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--bg2);font-size:12px;color:var(--ink3);font-weight:700}
tr:last-child td{border-bottom:0}
td.ko{font-family:"Noto Sans KR",sans-serif;font-size:18px;font-weight:500;cursor:pointer}
td.ko:hover{color:var(--red)}
td.lab{font-weight:700;background:var(--bg2);font-size:13px;color:var(--ink2)}
td.l{text-align:left;white-space:normal}

/* points */
.points{display:grid;gap:10px}
@media(min-width:768px){.points{grid-template-columns:repeat(2,1fr)}}
.pt{padding:14px 16px;border-radius:14px;background:var(--gold-soft);font-size:14px;display:flex;gap:10px}
.pt b{display:block;font-size:15px;margin-bottom:2px}
.pt::before{content:"💡"}

/* words */
.words{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.w{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.2s;text-align:left;width:100%}
.w:hover{border-color:var(--jade);background:var(--jade-soft)}
.w .k{font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:19px;white-space:nowrap}
.w .m{font-size:13px;color:var(--ink2);line-height:1.4}
.w .p{font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--jade);display:block}
.w .sp{margin-left:auto;font-size:13px;opacity:.5;flex-shrink:0}
.list{list-style:none;display:grid;gap:8px}
.list li{position:relative;padding-left:24px;font-size:15px}
.list li::before{content:"";position:absolute;left:4px;top:.65em;width:8px;height:8px;border-radius:50%;border:2px solid var(--indigo)}
.list.hw li::before{border-radius:3px;border-color:var(--gold)}
.memo{margin-top:16px;padding:14px 16px;border-radius:14px;border:1px dashed var(--indigo);background:var(--indigo-soft);font-size:14px}
.memo b{color:var(--indigo);display:block;font-size:12px;letter-spacing:.06em;margin-bottom:2px}

/* quiz */
.quiz{display:grid;gap:14px}
.q{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--card)}
.q .qt{font-weight:700;font-size:16px;margin-bottom:12px;display:flex;gap:10px}
.q .qt span{flex-shrink:0;width:26px;height:26px;border-radius:8px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:13px}
.opts{display:grid;gap:8px}
@media(min-width:600px){.opts{grid-template-columns:repeat(3,1fr)}}
.opt{padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);cursor:pointer;text-align:left;font-size:15px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ink3)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);font-weight:700}
.opt.ng{border-color:var(--ng);background:var(--ng-soft);color:var(--ng)}
.ex{display:none;margin-top:12px;font-size:14px;color:var(--ink2);padding:10px 14px;border-radius:10px;background:var(--bg2)}
.q.answered .ex{display:block}
.score{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;background:var(--ink);color:var(--bg)}
.score b{font-size:20px}
.score button{background:var(--bg);color:var(--ink);border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px}

/* test sheet */
.sheet{display:grid;gap:12px}
@media(min-width:768px){.sheet{grid-template-columns:repeat(3,1fr)}}
.sh{border:1px solid var(--line);border-radius:18px;padding:18px;background:var(--bg2)}
.sh h4{font-size:15px;margin-bottom:4px}
.sh small{font-size:12px;color:var(--ink3);display:block;margin-bottom:12px}
.sh ol{padding-left:22px;display:grid;gap:4px;font-size:15px}
.sh ol li span{font-family:"Noto Sans KR",sans-serif;font-weight:500}
.ans{color:var(--jade);font-size:13px;margin-left:6px;opacity:0;transition:.2s}
.show-ans .ans{opacity:1}
.toggle{margin-top:12px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer}

.lfoot{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 22px;border-top:1px solid var(--line);background:var(--bg2)}
@media(min-width:768px){.lfoot{padding:20px 44px}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--line);background:var(--card);transition:.2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.done{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:disabled{opacity:.35;cursor:default}
.fgrp{display:flex;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
footer{padding:32px 0 calc(32px + env(safe-area-inset-bottom));text-align:center;color:var(--ink3);font-size:13px;border-top:1px solid var(--line)}
@media print{
  header,.lfoot,.overview,footer,.toggle,.score button{display:none!important}
  body{background:#fff}.lesson{box-shadow:none;border:0}.ans{opacity:1}.ex{display:block}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <h1>ハングルと発音</h1>
  <p>8回でハングルを読み書きでき、聞いた単語を書き取れるようになるのがゴールです。文字や単語をタップすると韓国語の音声が流れます。</p>

<script>
const FLOWC=['var(--gold)','var(--jade)','var(--red)','var(--indigo)','#2b9bb5','#7a5bb5'];
const L=[
{no:1,title:'基本母音',sub:'ハングルのしくみと10の母音',big:'아',
 goals:['基本母音10個を読み、書き順どおりに書ける','「子音＋母音」で1文字になるしくみを説明できる'],
 flow:[[5,'あいさつ・導入','韓国語でできること、学習の目標を共有'],[10,'ハングルのしくみ','子音＋母音（＋パッチム）でブロックを作る。ㅇは母音だけの文字の「席」'],[20,'基本母音10個','口の形を見せながら発音→書き順。ㅓ／ㅗ、ㅜ／ㅡの違いに時間をかける'],[15,'練習','先生が読んだ文字を指さす／単語を読む'],[7,'聞き取り','10個の母音をランダムに聞いて書く'],[3,'まとめ・宿題','書き順と口の形を確認']],
 letters:[{g:'縦棒（ㅇの右につく）',items:[['아','ㅏ','ア'],['야','ㅑ','ヤ'],['어','ㅓ','オ（口を大きく開ける）'],['여','ㅕ','ヨ（口を大きく）'],['이','ㅣ','イ']]},
          {g:'横棒（ㅇの下につく）',items:[['오','ㅗ','オ（唇を丸める）'],['요','ㅛ','ヨ（唇を丸める）'],['우','ㅜ','ウ（唇を丸めて突き出す）'],['유','ㅠ','ユ'],['으','ㅡ','ウ（唇を横に引く）']]}],

 practice:['先生が読んだ母音カードを指さす（10回×2セット）','鏡を見ながら ㅓ／ㅗ、ㅜ／ㅡ を交互に発音','単語6つを読み、漢字語（理由・余裕）を当てる'],
 homework:['母音10個を各10回、書き順どおりに書く','単語6つを音読して録音し、提出する'],
 memo:'日本語話者は ㅓ を ㅗ に、ㅡ を ㅜ に寄せがち。口の形を大げさにして違いを体で覚えさせる。',

/* ---------- speech ---------- */
let koVoice=null,warned=false;
function loadVoice(){try{const vs=speechSynthesis.getVoices();koVoice=vs.find(v=>/^ko/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(t){
  if(!('speechSynthesis' in window)){toast('このブラウザは音声読み上げに対応していません');return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[［］\[\]○]/g,''));u.lang='ko-KR';u.rate=.8;if(koVoice)u.voice=koVoice;speechSynthesis.speak(u);
    if(!koVoice&&!warned)setTimeout(()=>{loadVoice();if(!koVoice){warned=true;toast('韓国語の音声がない場合は、端末の設定で韓国語の音声を追加してください')}},300)}catch(e){}
}
const tEl=document.getElementById('toast');let tT;
function toast(m){tEl.textContent=m;tEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>tEl.classList.remove('show'),2600)}

/* ---------- progress ---------- */
let done=[];try{done=JSON.parse(localStorage.getItem('step0-done')||'[]')}catch(e){}
function saveDone(){try{localStorage.setItem('step0-done',JSON.stringify(done))}catch(e){}}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isKo=s=>/[가-힣ㄱ-ㆎ]/.test(s);

/* ---------- nav ---------- */
const lnav=document.getElementById('lnav'),ov=document.getElementById('overview');
function renderNav(cur){
  lnav.innerHTML=L.map((l,i)=>`<button data-i="${i}" class="${done.includes(l.no)?'done':''}" aria-current="${i===cur}"><i>${done.includes(l.no)?'✓':l.no}</i>${l.title}</button>`).join('');
  ov.innerHTML=L.map((l,i)=>`<button class="ov${i===cur?' cur':''}" data-i="${i}"><small>第${l.no}回${done.includes(l.no)?' ✓':''}</small><b>${l.title}</b></button>`).join('');
  [...lnav.children,...ov.children].forEach(b=>b.onclick=()=>go(+b.dataset.i,true));
  const c=lnav.children[cur];if(c)lnav.scrollTo({left:c.offsetLeft-(lnav.clientWidth-c.offsetWidth)/2,behavior:'smooth'});
}

/* ---------- lesson ---------- */
const art=document.getElementById('lesson');
function render(i){
  const l=L[i];let n=0;const sec=(t,body,desc='')=>`<section class="sec"><h3><span class="n">${++n}</span>${t}</h3>${desc?`<p class="desc">${desc}</p>`:''}${body}</section>`;
  let h=`<div class="lhead"><span class="big" lang="ko">${l.big}</span><div class="no">第${l.no}回 / 全8回</div><h2>${l.title}</h2><div class="sub">${l.sub}</div><div class="goals">${l.goals.map(g=>`<div class="goal">${esc(g)}</div>`).join('')}</div></div><div class="lbody">`;
  const tot=l.flow.reduce((a,f)=>a+f[0],0);let acc=0;
  h+=sec('60分の流れ',`<div class="timebar">${l.flow.map((f,k)=>`<div style="flex:${f[0]};background:${FLOWC[k%6]}">${f[0]>=7?f[0]+'分':''}</div>`).join('')}</div><div class="flow">${l.flow.map((f,k)=>{const s=acc;acc+=f[0];return `<div class="fi"><div class="t"><i style="background:${FLOWC[k%6]}"></i>${s}〜${acc}分</div><div><b>${esc(f[1])}</b><p>${esc(f[2])}</p></div></div>`}).join('')}</div>`);
  if(l.letters)h+=sec('文字',l.letters.map(g=>`<div class="grp-label">${g.g}</div><div class="letters">${g.items.map(x=>`<button class="lt" data-say="${x[0]}"><span class="sp">🔊</span><div class="k" lang="ko">${x[1]}</div><div class="s" lang="ko">${x[0]}</div><div class="r">${x[2]}</div></button>`).join('')}</div>`).join(''),'タップすると音声が流れます');
  if(l.table){const lf=l.table.left||[];h+=sec(l.no===2?'가나다表':l.no===3?'3段比較表':l.no===5?'7つの代表音':l.no===6?'発音の変化':'あいさつ表現',
    `<div class="tbl-wrap"><table><thead><tr>${l.table.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${l.table.rows.map(r=>`<tr>${r.map((c,k)=>{
      if(l.no===2&&k===0)return `<td class="lab" lang="ko">${c}</td>`;
      if(l.no===3&&k===0)return `<td class="lab">${c}</td>`;
      if(lf.includes(k))return `<td class="l">${esc(c)}</td>`;
      if(c!=='—'&&isKo(c)&&!/^［/.test(c)&&!/ㄱ ㅋ|ㄷ ㅌ|ㅂ ㅍ/.test(c))return `<td class="ko" lang="ko" data-say="${esc(c.replace(/［.*$/,'').replace(/（.*$/,''))}">${esc(c)}</td>`;
      return `<td>${esc(c)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`,'韓国語のセルをタップすると音声が流れます')}
  h+=sec('ポイント',`<div class="points">${l.points.map(p=>`<div class="pt"><div><b>${esc(p[0])}</b>${esc(p[1])}</div></div>`).join('')}</div>`);
  if(l.words)h+=sec('単語',`<div class="words">${l.words.map(w=>`<button class="w" data-say="${w[0]}"><span class="k" lang="ko">${w[0]}</span><span class="m">${w[2]?`<span class="p" lang="ko">［${w[2]}］</span>`:''}${esc(w[1])}</span><span class="sp">🔊</span></button>`).join('')}</div>`);
  if(l.sheet)h+=sec('小テスト（プリント）',`<div class="sheet" id="sheet">${l.sheet.map(s=>`<div class="sh"><h4>${s.t}</h4><small>${s.d}</small><ol>${s.items.map(x=>`<li><span lang="ko">${esc(x[0])}</span><span class="ans">${esc(x[1])}</span></li>`).join('')}</ol></div>`).join('')}</div><button class="toggle" id="ansBtn">答えを表示</button>`,'印刷して使えます（右上のプリンターボタン）。書き取りの単語は先生が読み上げます');
  h+=sec('練習',`<ul class="list">${l.practice.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><div class="memo"><b>教師メモ</b>${esc(l.memo)}</div>`);
  h+=sec('宿題',`<ul class="list hw">${l.homework.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`);
  h+=sec('確認クイズ',`<div class="quiz" id="quiz">${l.quiz.map((q,k)=>`<div class="q" data-k="${k}"><div class="qt"><span>Q${k+1}</span>${esc(q.q)}</div><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}"${isKo(o)?' lang="ko"':''}>${esc(o)}</button>`).join('')}</div><div class="ex">${esc(q.e)}</div></div>`).join('')}<div class="score" id="score" hidden><b id="scoreTxt"></b><button id="retry">もう一度</button></div></div>`,'答えを選ぶとすぐに正誤と解説が出ます');
  h+=`</div><div class="lfoot"><button class="btn ${done.includes(l.no)?'done':''}" id="doneBtn">${done.includes(l.no)?'✓ 完了済み':'この回を完了にする'}</button><div class="fgrp"><button class="btn" id="prevBtn" ${i===0?'disabled':''}>← 前の回</button><button class="btn primary" id="nextBtn" ${i===L.length-1?'disabled':''}>次の回 →</button></div></div>`;
  art.innerHTML=h;art.classList.remove('fade');void art.offsetWidth;art.classList.add('fade');
  bind(i);
}
function bind(i){
  const l=L[i];
  art.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  let score=0,ans=0;
  art.querySelectorAll('.q').forEach(qe=>{const q=l.quiz[+qe.dataset.k];
    qe.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      const j=+o.dataset.j;qe.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('ok')});
      if(j!==q.a)o.classList.add('ng');else score++;
      qe.classList.add('answered');ans++;
      if(isKo(q.o[q.a]))say(q.o[q.a].replace(/［|］/g,''));
      if(ans===l.quiz.length){const s=document.getElementById('score');s.hidden=false;document.getElementById('scoreTxt').textContent=`${l.quiz.length}問中 ${score}問 正解${score===l.quiz.length?' 🎉':''}`}
    })});
  document.getElementById('retry').onclick=()=>{render(i);document.getElementById('quiz').scrollIntoView({behavior:'smooth',block:'start'})};
  const ab=document.getElementById('ansBtn');if(ab)ab.onclick=()=>{const s=document.getElementById('sheet');s.classList.toggle('show-ans');ab.textContent=s.classList.contains('show-ans')?'答えを隠す':'答えを表示'};
  document.getElementById('prevBtn').onclick=()=>go(i-1,true);
  document.getElementById('nextBtn').onclick=()=>go(i+1,true);
  document.getElementById('doneBtn').onclick=()=>{
    if(done.includes(l.no))done=done.filter(x=>x!==l.no);else{done.push(l.no);toast(`第${l.no}回を完了にしました`)}
    saveDone();render(i);renderNav(i)};
}
function go(i,scroll){
  if(i<0||i>=L.length)return;
  render(i);renderNav(i);
  if(location.hash!=='#l'+(i+1))history.replaceState(null,'','#l'+(i+1));
  if(scroll)document.querySelector('.hero').scrollIntoView({behavior:'smooth'});
}
const m=location.hash.match(/^#l([1-8])$/);
go(m?+m[1]-1:0,false);
addEventListener('hashchange',()=>{const m=location.hash.match(/^#l([1-8])$/);if(m)go(+m[1]-1,true)});

document.getElementById('printBtn').onclick=()=>print();
const root=document.documentElement;
try{const t=localStorage.getItem('theme');if(t)root.dataset.theme=t}catch(e){}
document.getElementById('themeBtn').onclick=()=>{
  const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',root.dataset.theme)}catch(e){}
};
</script>
