<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんこくご教室｜ハングルからTOPIK 6級まで</title>
<meta name="description" content="日本語話者のための韓国語学習アプリ。ハングルゼロからTOPIK 6級まで、タップで音声・単語カード・クイズで学べます。">
<meta name="theme-color" content="#faf6f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1c2b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かんこくご">
<meta property="og:title" content="かんこくご教室">
<meta property="og:description" content="ハングルゼロからTOPIK 6級まで。タップで音声、単語カード、クイズ。">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Jua&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f0;--dot:#ece3d6;--card:#fffefb;--ink:#2e2b3d;--ink2:#636075;--ink3:#9a96a8;--on:#2e2b3d;--line:#4a4660;--shc:rgba(74,70,96,.22);
  --pink:#f6b3c9;--yellow:#fbe29a;--mint:#a9e4c8;--sky:#b3daf0;--purple:#d0bff3;--orange:#fbcaa6;--red:#f2a7a7;--accent:#d8789c;
  --pink-s:#fcecf2;--yellow-s:#fdf5da;--mint-s:#e6f6ee;--sky-s:#e8f3fa;--purple-s:#f1ebfb;--orange-s:#fdefe4;
  --bw:2px;--sh:3px 3px 0 var(--shc);--sh-s:2px 2px 0 var(--shc);--sh-l:5px 5px 0 var(--shc);
  --r:22px;--tab:68px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1f1c2b;--dot:#2a2639;--card:#29253a;--ink:#f1ece4;--ink2:#c9c3d6;--ink3:#938ea6;--line:#7a7494;--shc:rgba(0,0,0,.35);--pink:#d996ae;--yellow:#e3cc85;--mint:#8fcdb0;--sky:#97c3dc;--purple:#b4a3dd;--orange:#e0b08d;--red:#d99292;--accent:#e79ab6;
  --pink-s:#3a2833;--yellow-s:#39331f;--mint-s:#22352d;--sky-s:#223240;--purple-s:#2f2943;--orange-s:#3a2e25;}}
:root[data-theme="dark"]{
  --bg:#1f1c2b;--dot:#2a2639;--card:#29253a;--ink:#f1ece4;--ink2:#c9c3d6;--ink3:#938ea6;--line:#7a7494;--shc:rgba(0,0,0,.35);--pink:#d996ae;--yellow:#e3cc85;--mint:#8fcdb0;--sky:#97c3dc;--purple:#b4a3dd;--orange:#e0b08d;--red:#d99292;--accent:#e79ab6;
  --pink-s:#3a2833;--yellow-s:#39331f;--mint-s:#22352d;--sky-s:#223240;--purple-s:#2f2943;--orange-s:#3a2e25;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans KR",system-ui,sans-serif;font-weight:500;line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh}
[lang="ko"],.ko{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.jua{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{padding:0 28px}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;padding-top:var(--sat);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topin{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--pink);color:var(--on);border:var(--bw) solid var(--line);box-shadow:var(--sh-s);display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:22px;transform:rotate(-6deg);flex-shrink:0}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:14px;border:var(--bw) solid var(--line);background:var(--card);box-shadow:var(--sh-s);display:grid;place-items:center;flex-shrink:0;transition:transform .12s,box-shadow .12s}
.ibtn:active,.press:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shc)}
.ml{margin-left:auto}
.ttl{flex:1;min-width:0;text-align:center;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 12px calc(10px + var(--sab));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:var(--bw) solid var(--line);border-radius:24px;box-shadow:var(--sh);padding:6px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 5px;border-radius:17px;font-size:11px;font-weight:900;color:var(--ink2);transition:.15s}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{background:var(--yellow);color:var(--on);box-shadow:inset 0 0 0 2px var(--line)}
.hide-tab .tabbar{display:none}

main{padding:8px 0 calc(var(--tab) + 40px + var(--sab))}
.view{animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- common ---------- */
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;margin:30px 0 14px}
.h2 .tag{font-size:11px;padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:var(--mint);color:var(--on);transform:rotate(-3deg)}
.h2 small{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:18px;border:var(--bw) solid var(--line);box-shadow:var(--sh);font-weight:900;font-size:16px;background:var(--card);transition:transform .12s,box-shadow .12s;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shc)}
.btn.pink{background:var(--pink);color:var(--on)}.btn.yellow{background:var(--yellow);color:var(--on)}.btn.mint{background:var(--mint);color:var(--on)}.btn.sky{background:var(--sky);color:var(--on)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:14px;box-shadow:var(--sh-s)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;border:2px solid var(--line);background:var(--card);white-space:nowrap}
.sticker{position:absolute;font-family:"Jua",sans-serif;pointer-events:none;user-select:none}

/* ---------- home ---------- */
.hero{position:relative;margin-top:10px;padding:24px 20px 22px;background:var(--yellow);color:var(--on);overflow:hidden}
@media(min-width:768px){.hero{padding:34px 34px 30px}}
.hero .hi{font-family:"Jua",sans-serif;font-size:clamp(40px,11vw,64px);line-height:1;letter-spacing:.01em;text-shadow:2px 2px 0 var(--card)}
.hero p{font-weight:700;margin:10px 0 16px;font-size:15px;max-width:420px}
.hero .s1{right:14px;top:6px;font-size:54px;transform:rotate(12deg);color:var(--card);-webkit-text-stroke:2px var(--line)}
.hero .s2{right:84px;top:58px;font-size:26px;transform:rotate(-14deg)}
.hero .s3{right:30px;top:112px;font-size:28px;transform:rotate(8deg)}
.prog{background:var(--card);color:var(--ink);border:var(--bw) solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:14px;box-shadow:var(--sh-s)}
.prog-top{display:flex;justify-content:space-between;font-size:13px;font-weight:900;margin-bottom:8px}
.bar{height:14px;border-radius:999px;border:2px solid var(--line);background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--mint) 0 8px,color-mix(in srgb,var(--mint) 70%,#fff) 8px 16px);border-right:2px solid var(--line);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.bar i[style*="width:0"]{border-right:0}
.cta{font-size:17px;padding:16px 18px;border-color:var(--line);box-shadow:var(--sh)}
.cta small{display:block;font-size:12px;font-weight:700;opacity:.8}
.cta .play{width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--ink);border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;font-size:14px}

.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.lgrid{grid-template-columns:repeat(4,1fr)}}
.lc{position:relative;display:block;padding:14px 14px 12px;border-radius:20px;border:var(--bw) solid var(--line);box-shadow:var(--sh);background:var(--c);color:var(--on);transition:transform .15s,box-shadow .15s;overflow:hidden;min-height:150px}
.lc:nth-child(odd){transform:rotate(-.6deg)}.lc:nth-child(even){transform:rotate(.5deg)}
.lc:hover{transform:rotate(0) translateY(-3px);box-shadow:var(--sh-l)}
.lc:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shc)}
.lc .num{font-size:12px;font-weight:900;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:999px;padding:1px 9px;display:inline-block}
.lc .g{font-family:"Jua",sans-serif;font-size:56px;line-height:1;margin:10px 0 4px;text-shadow:2px 2px 0 rgba(255,255,255,.55)}
.lc b{display:block;font-size:15px;line-height:1.35}
.lc .st{position:absolute;right:10px;top:10px;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;border:2px solid var(--line);background:#fff;color:#3a3650}
.lc .st.done{background:var(--line);color:#fff}
.lc .st.next{background:#fff;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}

.wod{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--sky-s)}
.wod .k{font-size:34px;font-weight:900;line-height:1.1}
.wod .m{font-size:14px;color:var(--ink2);font-weight:700}
.wod .sp{margin-left:auto}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 16px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.fs{flex:0 0 220px;scroll-snap-align:start;padding:16px;border-radius:20px;border:var(--bw) dashed var(--line);background:var(--card);position:relative}
.fs .n{font-family:"Jua",sans-serif;font-size:30px;line-height:1;color:var(--c)}
.fs b{display:block;margin:6px 0 2px}
.fs small{display:block;font-size:12px;color:var(--ink3);font-weight:700}
.fs .goal{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--cs);border:2px solid var(--line)}
.fs .lock{position:absolute;right:12px;top:12px;font-size:11px;font-weight:900;color:var(--ink3)}
.install{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--mint-s);margin-top:18px}
.install .ic{font-size:26px}
.install p{font-size:13px;font-weight:700;flex:1;line-height:1.5}
.install p b{display:block;font-size:15px}

/* ---------- lesson ---------- */
.lhero{position:relative;padding:20px 18px 18px;background:var(--c);color:var(--on);overflow:hidden;margin-top:6px}
.lhero .g{position:absolute;right:12px;top:-6px;font-family:"Jua",sans-serif;font-size:110px;line-height:1;opacity:.22;transform:rotate(8deg)}
.lhero .no{display:inline-block;font-size:12px;font-weight:900;border:2px solid var(--line);background:#fff;border-radius:999px;padding:1px 10px}
.lhero h1{font-size:clamp(26px,7vw,36px);font-weight:900;line-height:1.25;margin:8px 0 2px;position:relative}
.lhero .sub{font-weight:700;font-size:14px;position:relative}
.goals{display:grid;gap:6px;margin-top:14px;position:relative}
.goals div{font-size:13.5px;font-weight:700;background:rgba(255,255,255,.75);border:2px solid var(--line);border-radius:12px;padding:7px 12px;line-height:1.5}
.seg{position:sticky;top:calc(60px + var(--sat));z-index:30;margin:14px 0 0;padding:8px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:var(--bw) solid var(--line);border-radius:18px;padding:5px;box-shadow:var(--sh-s)}
.seg a{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:13px;font-weight:900;font-size:14px;color:var(--ink2);transition:.15s}
.seg a i{font-style:normal;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:11px}
.seg a.on{background:var(--line);color:var(--card)}
.seg a.ok i{background:var(--mint);border-color:var(--ink);color:var(--on)}
.panel{padding-top:8px}
.blk{margin-top:18px}
.blk h3{font-size:16px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.blk h3 em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:700;margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;background:var(--card);border:var(--bw) solid var(--line);border-radius:18px;box-shadow:var(--sh-s);padding:12px 6px 10px;text-align:center;transition:transform .12s,box-shadow .12s,background .2s}
.tile:active,.tile.playing{transform:translate(2px,2px);box-shadow:0 0 0 var(--shc);background:var(--yellow-s)}
.tile .k{font-family:"Noto Sans KR",sans-serif;font-size:40px;font-weight:700;line-height:1.1}
.tile .s{font-family:"Jua",sans-serif;font-size:18px;color:var(--accent);line-height:1.2}
.tile .r{font-size:11.5px;color:var(--ink2);line-height:1.35;margin-top:3px;font-weight:700}
.tile .sp{position:absolute;right:7px;top:5px;font-size:11px;opacity:.55}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:var(--bw) solid var(--line);border-radius:18px;box-shadow:var(--sh-s)}
.tbl table{border-collapse:collapse;width:100%;min-width:max-content}
.tbl th,.tbl td{padding:10px 12px;border-bottom:2px dashed color-mix(in srgb,var(--ink) 18%,transparent);text-align:center;white-space:nowrap;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--yellow-s);font-size:12px;font-weight:900}
.tbl td.ko{font-size:19px;font-weight:700;cursor:pointer}
.tbl td.ko:active{background:var(--yellow-s)}
.tbl td.lab{background:var(--pink-s);font-weight:900}
.tbl td.l{text-align:left;white-space:normal;min-width:150px}
.tbl.fit table{min-width:0}
.bubbles{display:grid;gap:12px}
@media(min-width:640px){.bubbles{grid-template-columns:repeat(2,1fr)}}
.bub{position:relative;background:var(--card);border:var(--bw) solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 14px;box-shadow:var(--sh-s);font-size:14px}
.bub b{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:2px}
.bub b::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c,var(--pink));border:2px solid var(--line);flex-shrink:0}
.sheetg{display:grid;gap:12px}
@media(min-width:640px){.sheetg{grid-template-columns:repeat(3,1fr)}}
.sh{background:var(--card);border:var(--bw) solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--sh-s)}
.sh h4{font-size:15px;font-weight:900}
.sh small{display:block;font-size:12px;color:var(--ink3);margin-bottom:8px;font-weight:700}
.sh ol{padding-left:22px;display:grid;gap:3px;font-size:15px}
.sh .ans{color:var(--pink);font-size:12.5px;margin-left:6px;font-weight:900;visibility:hidden}
.show-ans .ans{visibility:visible}

/* flashcards */
.deck{perspective:1200px;margin-top:8px}
.fc{position:relative;height:min(300px,44vh);min-height:230px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
@media(min-width:640px){.fc{height:340px}}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--line);border-radius:28px;box-shadow:var(--sh-l);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.front{background:var(--card)}
.face.back{background:var(--c);color:var(--on);transform:rotateY(180deg)}
.face .big{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:clamp(44px,13vw,72px);line-height:1.15;word-break:keep-all}
.face .hint{position:absolute;bottom:16px;font-size:12px;font-weight:900;color:var(--ink3)}
.face.back .hint{color:var(--on);opacity:.6}
.face .mean{font-size:clamp(24px,7vw,34px);font-weight:900;line-height:1.35}
.face .pr{font-family:"Noto Sans KR",sans-serif;font-size:18px;font-weight:700;margin-top:6px;opacity:.85}
.face .cnt{position:absolute;top:14px;left:16px;font-size:12px;font-weight:900;padding:2px 10px;border:2px solid currentColor;border-radius:999px}
.face .lk{position:absolute;top:14px;right:16px;font-size:12px;font-weight:900}
.fctrl{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;margin-top:18px;align-items:center}
.fctrl .ibtn{width:56px;height:56px;border-radius:18px;font-size:20px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:14px}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.dots i.on{background:var(--pink);transform:scale(1.25)}
.dots i.got{background:var(--mint)}
.wlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:var(--bw) solid var(--line);border-radius:16px;box-shadow:var(--sh-s);text-align:left;width:100%;transition:transform .12s,box-shadow .12s}
.wrow:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shc)}
.wrow .k{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:19px;white-space:nowrap}
.wrow .m{font-size:13px;color:var(--ink2);line-height:1.35;font-weight:700;min-width:0}
.wrow .p{display:block;font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--accent)}
.wrow .sp{margin-left:auto;flex-shrink:0;font-size:14px}
.wrow .lb{flex-shrink:0;font-size:10px;font-weight:900;padding:1px 7px;border-radius:999px;border:2px solid var(--line);background:var(--yellow-s)}

/* quiz */
.qwrap{margin-top:8px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead .bar{flex:1}
.qhead b{font-size:14px;font-weight:900;white-space:nowrap}
.qcard{padding:22px 18px;background:var(--card)}
.qcard .qq{font-size:19px;font-weight:900;line-height:1.5}
.qcard .qn{display:inline-block;font-family:"Jua",sans-serif;font-size:16px;background:var(--pink);color:var(--on);border:2px solid var(--line);border-radius:10px;padding:0 10px;margin-bottom:10px;transform:rotate(-3deg)}
.opts{display:grid;gap:10px;margin-top:16px}

const cleanSay=t=>String(t).replace(/○○/g,'다나카').replace(/[［］\[\]○]/g,'').replace(/（.*?）/g,'').trim();
let koVoice=null,warned=false,curA=null;const acache={};
function loadVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
  const rank=v=>(/natural|neural|premium|enhanced|online/i.test(v.name)?4:0)+(/google|yuna|sunhi|heami|injoon|sora/i.test(v.name)?2:0)+(v.localService?0:1);
  koVoice=vs.sort((a,b)=>rank(b)-rank(a))[0]||null}catch(e){}}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function ttsFallback(t){
  if(!('speechSynthesis' in window)){if(!warned){warned=true;toast(T().noVoice)}return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/ \/ /g,', '));u.lang='ko-KR';u.rate=.85;if(koVoice)u.voice=koVoice;speechSynthesis.speak(u);
    if(!koVoice&&!warned)setTimeout(()=>{loadVoice();if(!koVoice&&!warned){warned=true;toast(T().addVoice)}},400)}catch(e){}
}
function say(t,el){
  if(el){el.classList.add('playing');setTimeout(()=>el.classList.remove('playing'),350)}
  const c=cleanSay(t),h=AUDIO[c];
  try{if(curA){curA.pause();curA.currentTime=0}}catch(e){}
  try{speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  if(!h)return ttsFallback(c);
  const a=acache[h]||(acache[h]=new Audio('audio/'+h+'.mp3'));curA=a;
  try{a.currentTime=0;const p=a.play();if(p&&p.catch)p.catch(()=>ttsFallback(c))}catch(e){ttsFallback(c)}
}
function preload(list){list.forEach(t=>{const h=AUDIO[cleanSay(t)];if(h&&!acache[h]){const a=new Audio();a.preload='auto';a.src='audio/'+h+'.mp3';acache[h]=a}})}

    s.style.left=x+'px';s.style.top=y+'px';s.style.color=`var(${cl[i%cl.length]})`;
    const a=Math.random()*Math.PI*2,d=50+Math.random()*100;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d-40+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');

const wrow=(x,lb)=>`<button class="wrow" data-say="${esc(x.k)}"><span class="k" lang="ko">${esc(x.k)}</span><span class="m" lang="ja">${x.p?`<span class="p" lang="ko">［${esc(x.p)}］</span>`:''}${esc(x.m)}</span>${lb?`<span class="lb">${x.no}</span>`:''}<span class="sp">🔊</span></button>`;
function pQuiz(l){
  const t=T(),q=qState;
  if(q.i>=l.quiz.length){
    const n=l.quiz.length,s=q.score,st=s===n?3:s>=n*.6?2:1;
    return `<div class="qwrap"><div class="card result"><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="sc">${s}<span> / ${n}</span></div><p>${s===n?t.perfect:s>=n*.6?t.good:t.retryMsg}</p>
      <div class="btns">${l.no<L.length?`<a href="#/l/${l.no+1}" class="btn pink block">${t.toNext(l.no+1)}</a>`:`<a href="#/" class="btn pink block">${t.fin}</a>`}<button class="btn block" id="qRetry">${t.retry}</button><a href="#/l/${l.no}/cards" class="btn block">${t.review}</a></div></div></div>`;
  }
  const it=l.quiz[q.i],ans=q.ans;
  return `<div class="qwrap"><div class="qhead"><div class="bar"><i style="width:${q.i/l.quiz.length*100}%"></i></div><b>${q.i+1} / ${l.quiz.length}</b></div>
    <div class="card qcard"><span class="qn">Q${q.i+1}</span><div class="qq">${esc(it.q)}</div>
    <div class="opts">${it.o.map((o,j)=>{let c='';if(ans!=null){c=j===it.a?'ok':j===ans?'ng':'dim'}return `<button class="opt ${c}" data-j="${j}" ${ans!=null?'disabled':''}${isKo(o)?' lang="ko"':''}><span class="l">${'ABC'[j]}</span><span class="ot">${esc(o)}</span></button>`}).join('')}</div>
    ${ans!=null?`<div class="fb ${ans===it.a?'ok':'ng'}" role="status"><b>${ans===it.a?t.ok:t.ng}</b>${esc(it.e)}</div><button class="btn pink block" id="qNext">${q.i+1<l.quiz.length?t.nextQ:t.result}</button>`:''}
    </div></div>`;
}
function bindSay(root=document){root.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,b))}
function bindLesson(no,tab){
  const l=V(L.find(x=>x.no===no)),t=T(),panel=$('#panel');
  bindSay(panel);preload([...panel.querySelectorAll('[data-say]')].slice(0,40).map(e=>e.dataset.say));
  const ab=$('#ansBtn');if(ab)ab.onclick=()=>{const s=$('#sheet');s.classList.toggle('show-ans');ab.textContent=s.classList.contains('show-ans')?t.hideA:t.showA};
  if(tab==='cards'&&$('#fc')){
    const ws=words(l),f=fcState;
    const re=()=>{panel.innerHTML=pCards(l);bindLesson(no,tab)};
    const go=d=>{f.i=(f.i+d+ws.length)%ws.length;f.flip=false;re();say(ws[f.i].k)};
    const fc=$('#fc');const flip=()=>{f.flip=!f.flip;fc.classList.toggle('flip',f.flip);if(!f.flip)say(ws[f.i].k)};
    let sx=null,sy=null,moved=false;
    fc.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;moved=false},{passive:true});
    fc.addEventListener('touchmove',e=>{if(sx==null)return;const dx=e.touches[0].clientX-sx;if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(e.touches[0].clientY-sy)){moved=true;fc.style.transform=`translateX(${dx*.6}px) rotate(${dx*.03}deg)${f.flip?' rotateY(180deg)':''}`}},{passive:true});
    fc.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;fc.style.transform='';if(moved&&Math.abs(dx)>60){go(dx<0?1:-1)}});
    fc.onclick=()=>{if(!moved)flip();moved=false};
    fc.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)};
    $('#fPrev').onclick=()=>go(-1);$('#fNext').onclick=()=>go(1);
    $('#fSay').onclick=e=>say(ws[f.i].k,e.currentTarget);
    $('#fGot').onclick=e=>{const k=ws[f.i].k;if(f.got.has(k)){f.got.delete(k);store.set('got-'+no,[...f.got]);re();return}

      if(isKo(it.o[it.a]))say(it.o[it.a]);
      panel.innerHTML=pQuiz(l);bindLesson(no,tab);const nb=$('#qNext');if(nb)nb.scrollIntoView({block:'nearest',behavior:'smooth'})});
    const nb=$('#qNext');if(nb)nb.onclick=()=>{q.i++;q.ans=null;
      if(q.i>=l.quiz.length&&!done.includes(no)){done.push(no);store.set('done',done)}
      panel.innerHTML=pQuiz(l);bindLesson(no,tab);
      const seg=$('.seg');if(seg)window.scrollTo({top:Math.max(0,seg.getBoundingClientRect().top+scrollY-70),behavior:'smooth'});
      if(q.i>=l.quiz.length){setTimeout(()=>{const r=$('.result');if(r){const b=r.getBoundingClientRect();confetti(b.left+b.width/2,b.top+80,24)}},250);
        const si=$('.seg a[href$="/quiz"] i');if(si)si.textContent='✓'}};
    const rb=$('#qRetry');if(rb)rb.onclick=()=>{qState={no,i:0,score:0,ans:null};panel.innerHTML=pQuiz(l);bindLesson(no,tab)};
  }
}

function route(){const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='l'&&h[1]&&L.some(l=>l.no===+h[1]))return {v:'lesson',no:+h[1],tab:TABK.includes(h[2])?h[2]:'learn'};
  if(h[0]==='print'&&h[1])return {v:'print',no:+h[1],t:h[2]||'text'};
  if(h[0]==='words')return {v:'words'};if(h[0]==='guide')return {v:'guide'};return {v:'home'}}
let last=null;const scrollMem={};
function render(keep){
  const r=route(),key=r.v==='lesson'?`l${r.no}-${r.tab}`:r.v==='print'?`p${r.no}${r.t}`:r.v;
  if(last)scrollMem[last]=scrollY;
  if(r.v==='lesson'){
    if(!last||!last.startsWith(`l${r.no}-`))fcState={i:0,flip:false,got:new Set(store.get('got-'+r.no,[]))};
    if(r.tab==='quiz'&&(!qState||qState.no!==r.no||last!==key&&!keep))qState={no:r.no,i:0,score:0,ans:null};
  }
  document.body.classList.toggle('pmode',r.v==='print');
  document.body.dataset.view=r.v;
  const html=r.v==='print'?vPrint(r.no,r.t):r.v==='lesson'?vLesson(r.no,r.tab):r.v==='words'?vWords():r.v==='guide'?vGuide():vHome();
  if(r.v==='lesson')topbar('lesson',L.find(x=>x.no===r.no));else topbar('main');
  tabbar(r.v==='lesson'||r.v==='print'?null:r.v);
  $('#app').innerHTML=r.v==='print'||keep?html:`<div class="view">${html}</div>`;
  if(r.v==='print'){const pb=$('#pBtn');if(pb)pb.onclick=()=>print()}
  else if(r.v==='lesson')bindLesson(r.no,r.tab);else if(r.v==='words')bindWords();else if(r.v==='home')bindHome();
  if(keep){}else if(r.v==='lesson'&&last&&last.startsWith(`l${r.no}-`)){const seg=$('.seg');const y=seg?seg.getBoundingClientRect().top+scrollY-60:0;if(scrollY>y)scrollTo(0,y)}
  else scrollTo(0,scrollMem[key]&&r.v!=='lesson'?scrollMem[key]:0);
  last=key;
}
