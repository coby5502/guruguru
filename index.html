<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんこくご教室｜ハングルからTOPIK 6級まで</title>
<meta name="description" content="日本語話者のための韓国語学習アプリ。ハングルゼロからTOPIK 6級まで、タップで音声・単語カード・クイズで学べます。">
<meta name="theme-color" content="#fff4e2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1631" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かんこくご">
<meta property="og:title" content="かんこくご教室">
<meta property="og:description" content="ハングルゼロからTOPIK 6級まで。タップで音声、単語カード、クイズ。">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Jua&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+KR:wght@300;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4e2;--dot:#f1d6b0;--card:#fffdf8;--ink:#1d1a2e;--ink2:#575270;--ink3:#8d88a0;--on:#1d1a2e;
  --pink:#ff6fa8;--yellow:#ffd23f;--mint:#3ddc97;--sky:#5bc0eb;--purple:#a77bf0;--orange:#ff9a52;--red:#ff5c5c;
  --pink-s:#ffe0ec;--yellow-s:#fff0b3;--mint-s:#d2f6e5;--sky-s:#d9f1fb;--purple-s:#ece0fc;--orange-s:#ffe3cf;
  --bw:2.5px;--sh:4px 4px 0 var(--ink);--sh-s:2.5px 2.5px 0 var(--ink);--sh-l:6px 6px 0 var(--ink);
  --r:22px;--tab:68px;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c1631;--dot:#2c2450;--card:#2a2248;--ink:#fff1dc;--ink2:#d4cbea;--ink3:#9d93bb;
  --pink-s:#4d2142;--yellow-s:#4a3c16;--mint-s:#173f33;--sky-s:#16384b;--purple-s:#352559;--orange-s:#4b2e1c;}}
:root[data-theme="dark"]{
  --bg:#1c1631;--dot:#2c2450;--card:#2a2248;--ink:#fff1dc;--ink2:#d4cbea;--ink3:#9d93bb;
  --pink-s:#4d2142;--yellow-s:#4a3c16;--mint-s:#173f33;--sky-s:#16384b;--purple-s:#352559;--orange-s:#4b2e1c;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);background-image:radial-gradient(var(--dot) 1.4px,transparent 1.6px);background-size:22px 22px;color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans KR",system-ui,sans-serif;font-weight:500;line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh}
[lang="ko"],.ko{font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif}
.jua{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}
@media(min-width:768px){.wrap{padding:0 28px}}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;padding-top:var(--sat);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.topin{display:flex;align-items:center;gap:10px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:16px;min-width:0}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--pink);color:var(--on);border:var(--bw) solid var(--ink);box-shadow:var(--sh-s);display:grid;place-items:center;font-family:"Jua",sans-serif;font-size:22px;transform:rotate(-6deg);flex-shrink:0}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{width:42px;height:42px;border-radius:14px;border:var(--bw) solid var(--ink);background:var(--card);box-shadow:var(--sh-s);display:grid;place-items:center;flex-shrink:0;transition:transform .12s,box-shadow .12s}
.ibtn:active,.press:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.ml{margin-left:auto}
.ttl{flex:1;min-width:0;text-align:center;font-weight:900;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- bottom tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:0 12px calc(10px + var(--sab));pointer-events:none}
.tabbar nav{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:24px;box-shadow:var(--sh);padding:6px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 5px;border-radius:17px;font-size:11px;font-weight:900;color:var(--ink2);transition:.15s}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{background:var(--yellow);color:var(--on);box-shadow:inset 0 0 0 2px var(--ink)}
.hide-tab .tabbar{display:none}

main{padding:8px 0 calc(var(--tab) + 40px + var(--sab))}
.view{animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- common ---------- */
.card{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh)}
.h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;margin:30px 0 14px}
.h2 .tag{font-size:11px;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--mint);color:var(--on);transform:rotate(-3deg)}
.h2 small{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 20px;border-radius:18px;border:var(--bw) solid var(--ink);box-shadow:var(--sh);font-weight:900;font-size:16px;background:var(--card);transition:transform .12s,box-shadow .12s;text-align:center}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:var(--on)}.btn.yellow{background:var(--yellow);color:var(--on)}.btn.mint{background:var(--mint);color:var(--on)}.btn.sky{background:var(--sky);color:var(--on)}
.btn.block{display:flex;width:100%}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:14px;box-shadow:var(--sh-s)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--card);white-space:nowrap}
.sticker{position:absolute;font-family:"Jua",sans-serif;pointer-events:none;user-select:none}

/* ---------- home ---------- */
.hero{position:relative;margin-top:10px;padding:24px 20px 22px;background:var(--yellow);color:var(--on);overflow:hidden}
@media(min-width:768px){.hero{padding:34px 34px 30px}}
.hero .hi{font-family:"Jua",sans-serif;font-size:clamp(40px,11vw,64px);line-height:1;letter-spacing:.01em;text-shadow:3px 3px 0 var(--pink)}
.hero p{font-weight:700;margin:10px 0 16px;font-size:15px;max-width:420px}
.hero .s1{right:14px;top:6px;font-size:54px;transform:rotate(12deg);color:var(--pink);-webkit-text-stroke:2px #1d1a2e}
.hero .s2{right:84px;top:58px;font-size:26px;transform:rotate(-14deg)}
.hero .s3{right:30px;top:112px;font-size:28px;transform:rotate(8deg)}
.prog{background:var(--card);color:var(--ink);border:var(--bw) solid #1d1a2e;border-radius:18px;padding:12px 14px;margin-bottom:14px;box-shadow:3px 3px 0 #1d1a2e}
.prog-top{display:flex;justify-content:space-between;font-size:13px;font-weight:900;margin-bottom:8px}
.bar{height:14px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--mint) 0 8px,#2fc884 8px 16px);border-right:2px solid var(--ink);transition:width .8s cubic-bezier(.2,.9,.3,1)}
.bar i[style*="width:0"]{border-right:0}
.cta{font-size:17px;padding:16px 18px;border-color:#1d1a2e;box-shadow:4px 4px 0 #1d1a2e}
.cta small{display:block;font-size:12px;font-weight:700;opacity:.8}
.cta .play{width:34px;height:34px;border-radius:50%;background:var(--card);color:var(--ink);border:2px solid #1d1a2e;display:grid;place-items:center;flex-shrink:0;font-size:14px}

.lgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:640px){.lgrid{grid-template-columns:repeat(4,1fr)}}
.lc{position:relative;display:block;padding:14px 14px 12px;border-radius:20px;border:var(--bw) solid var(--ink);box-shadow:var(--sh);background:var(--c);color:var(--on);transition:transform .15s,box-shadow .15s;overflow:hidden;min-height:150px}
.lc:nth-child(odd){transform:rotate(-1.2deg)}.lc:nth-child(even){transform:rotate(1deg)}
.lc:hover{transform:rotate(0) translateY(-3px);box-shadow:var(--sh-l)}
.lc:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.lc .num{font-size:12px;font-weight:900;background:var(--card);color:var(--ink);border:2px solid #1d1a2e;border-radius:999px;padding:1px 9px;display:inline-block}
.lc .g{font-family:"Jua",sans-serif;font-size:56px;line-height:1;margin:10px 0 4px;text-shadow:2.5px 2.5px 0 rgba(255,255,255,.65)}
.lc b{display:block;font-size:15px;line-height:1.35}
.lc .st{position:absolute;right:10px;top:10px;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;border:2px solid #1d1a2e;background:#fff;color:#1d1a2e}
.lc .st.done{background:#1d1a2e;color:#fff}
.lc .st.next{background:#fff;animation:wig 1.6s ease-in-out infinite}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}

.wod{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--sky-s)}
.wod .k{font-size:34px;font-weight:900;line-height:1.1}
.wod .m{font-size:14px;color:var(--ink2);font-weight:700}
.wod .sp{margin-left:auto}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 16px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.fs{flex:0 0 220px;scroll-snap-align:start;padding:16px;border-radius:20px;border:var(--bw) dashed var(--ink);background:var(--card);position:relative}
.fs .n{font-family:"Jua",sans-serif;font-size:30px;line-height:1;color:var(--c)}
.fs b{display:block;margin:6px 0 2px}
.fs small{display:block;font-size:12px;color:var(--ink3);font-weight:700}
.fs .goal{display:inline-block;margin-top:10px;font-size:12px;font-weight:900;padding:3px 10px;border-radius:999px;background:var(--cs);border:2px solid var(--ink)}
.fs .lock{position:absolute;right:12px;top:12px;font-size:11px;font-weight:900;color:var(--ink3)}
.install{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--mint-s);margin-top:18px}
.install .ic{font-size:26px}
.install p{font-size:13px;font-weight:700;flex:1;line-height:1.5}
.install p b{display:block;font-size:15px}

/* ---------- lesson ---------- */
.lhero{position:relative;padding:20px 18px 18px;background:var(--c);color:var(--on);overflow:hidden;margin-top:6px}
.lhero .g{position:absolute;right:12px;top:-6px;font-family:"Jua",sans-serif;font-size:110px;line-height:1;opacity:.35;transform:rotate(8deg)}
.lhero .no{display:inline-block;font-size:12px;font-weight:900;border:2px solid #1d1a2e;background:#fff;border-radius:999px;padding:1px 10px}
.lhero h1{font-size:clamp(26px,7vw,36px);font-weight:900;line-height:1.25;margin:8px 0 2px;position:relative}
.lhero .sub{font-weight:700;font-size:14px;position:relative}
.goals{display:grid;gap:6px;margin-top:14px;position:relative}
.goals div{font-size:13.5px;font-weight:700;background:rgba(255,255,255,.75);border:2px solid #1d1a2e;border-radius:12px;padding:7px 12px;line-height:1.5}
.seg{position:sticky;top:calc(60px + var(--sat));z-index:30;margin:14px 0 0;padding:8px 0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.seg nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;padding:5px;box-shadow:var(--sh-s)}
.seg a{display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 4px;border-radius:13px;font-weight:900;font-size:14px;color:var(--ink2);transition:.15s}
.seg a i{font-style:normal;width:20px;height:20px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-size:11px}
.seg a.on{background:var(--ink);color:var(--bg)}
.seg a.ok i{background:var(--mint);border-color:var(--ink);color:var(--on)}
.panel{padding-top:8px}
.blk{margin-top:18px}
.blk h3{font-size:16px;font-weight:900;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.blk h3 em{font-style:normal;font-size:12px;color:var(--ink3);font-weight:700;margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(5,1fr)}}
.tile{position:relative;background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;box-shadow:var(--sh-s);padding:12px 6px 10px;text-align:center;transition:transform .12s,box-shadow .12s,background .2s}
.tile:active,.tile.playing{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink);background:var(--yellow-s)}
.tile .k{font-family:"Noto Sans KR",sans-serif;font-size:40px;font-weight:700;line-height:1.1}
.tile .s{font-family:"Jua",sans-serif;font-size:18px;color:var(--pink);line-height:1.2}
.tile .r{font-size:11.5px;color:var(--ink2);line-height:1.35;margin-top:3px;font-weight:700}
.tile .sp{position:absolute;right:7px;top:5px;font-size:11px;opacity:.55}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;box-shadow:var(--sh-s)}
.tbl table{border-collapse:collapse;width:100%;min-width:max-content}
.tbl th,.tbl td{padding:10px 12px;border-bottom:2px dashed color-mix(in srgb,var(--ink) 18%,transparent);text-align:center;white-space:nowrap;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl th{background:var(--yellow-s);font-size:12px;font-weight:900}
.tbl td.ko{font-size:19px;font-weight:700;cursor:pointer}
.tbl td.ko:active{background:var(--yellow-s)}
.tbl td.lab{background:var(--pink-s);font-weight:900}
.tbl td.l{text-align:left;white-space:normal;min-width:150px}
.tbl.fit table{min-width:0}
.bubbles{display:grid;gap:12px}
@media(min-width:640px){.bubbles{grid-template-columns:repeat(2,1fr)}}
.bub{position:relative;background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px 18px 18px 4px;padding:12px 14px;box-shadow:var(--sh-s);font-size:14px}
.bub b{display:flex;align-items:center;gap:6px;font-size:15px;margin-bottom:2px}
.bub b::before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c,var(--pink));border:2px solid var(--ink);flex-shrink:0}
.sheetg{display:grid;gap:12px}
@media(min-width:640px){.sheetg{grid-template-columns:repeat(3,1fr)}}
.sh{background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;padding:14px;box-shadow:var(--sh-s)}
.sh h4{font-size:15px;font-weight:900}
.sh small{display:block;font-size:12px;color:var(--ink3);margin-bottom:8px;font-weight:700}
.sh ol{padding-left:22px;display:grid;gap:3px;font-size:15px}
.sh .ans{color:var(--pink);font-size:12.5px;margin-left:6px;font-weight:900;visibility:hidden}
.show-ans .ans{visibility:visible}

/* flashcards */
.deck{perspective:1200px;margin-top:8px}
.fc{position:relative;height:min(300px,44vh);min-height:230px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.3,.5,1);cursor:pointer}
@media(min-width:640px){.fc{height:340px}}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:var(--bw) solid var(--ink);border-radius:28px;box-shadow:var(--sh-l);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.face.front{background:var(--card)}
.face.back{background:var(--c);color:var(--on);transform:rotateY(180deg)}
.face .big{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:clamp(44px,13vw,72px);line-height:1.15;word-break:keep-all}
.face .hint{position:absolute;bottom:16px;font-size:12px;font-weight:900;color:var(--ink3)}
.face.back .hint{color:var(--on);opacity:.6}
.face .mean{font-size:clamp(24px,7vw,34px);font-weight:900;line-height:1.35}
.face .pr{font-family:"Noto Sans KR",sans-serif;font-size:18px;font-weight:700;margin-top:6px;opacity:.85}
.face .cnt{position:absolute;top:14px;left:16px;font-size:12px;font-weight:900;padding:2px 10px;border:2px solid currentColor;border-radius:999px}
.face .lk{position:absolute;top:14px;right:16px;font-size:12px;font-weight:900}
.fctrl{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;margin-top:18px;align-items:center}
.fctrl .ibtn{width:56px;height:56px;border-radius:18px;font-size:20px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:14px}
.dots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.on{background:var(--pink);transform:scale(1.25)}
.dots i.got{background:var(--mint)}
.wlist{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.wrow{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:16px;box-shadow:var(--sh-s);text-align:left;width:100%;transition:transform .12s,box-shadow .12s}
.wrow:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.wrow .k{font-family:"Noto Sans KR",sans-serif;font-weight:900;font-size:19px;white-space:nowrap}
.wrow .m{font-size:13px;color:var(--ink2);line-height:1.35;font-weight:700;min-width:0}
.wrow .p{display:block;font-family:"Noto Sans KR",sans-serif;font-size:12px;color:var(--pink)}
.wrow .sp{margin-left:auto;flex-shrink:0;font-size:14px}
.wrow .lb{flex-shrink:0;font-size:10px;font-weight:900;padding:1px 7px;border-radius:999px;border:2px solid var(--ink);background:var(--yellow-s)}

/* quiz */
.qwrap{margin-top:8px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qhead .bar{flex:1}
.qhead b{font-size:14px;font-weight:900;white-space:nowrap}
.qcard{padding:22px 18px;background:var(--card)}
.qcard .qq{font-size:19px;font-weight:900;line-height:1.5}
.qcard .qn{display:inline-block;font-family:"Jua",sans-serif;font-size:16px;background:var(--pink);color:var(--on);border:2px solid var(--ink);border-radius:10px;padding:0 10px;margin-bottom:10px;transform:rotate(-3deg)}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:var(--bw) solid var(--ink);background:var(--bg);box-shadow:var(--sh-s);font-weight:900;font-size:17px;text-align:left;transition:transform .12s,box-shadow .12s,background .2s}
.opt .l{width:30px;height:30px;border-radius:10px;border:2px solid var(--ink);display:grid;place-items:center;font-size:13px;background:var(--card);flex-shrink:0}
.opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--mint);color:var(--on)}

let koVoice=null,warned=false;
function loadVoice(){try{koVoice=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang))||null}catch(e){}}
if('speechSynthesis' in window){loadVoice();speechSynthesis.onvoiceschanged=loadVoice}
function say(t,el){
  if(el){el.classList.add('playing');setTimeout(()=>el.classList.remove('playing'),350)}
  if(!('speechSynthesis' in window)){if(!warned){warned=true;toast('このブラウザは音声に対応していません')}return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(String(t).replace(/[［］\[\]○]/g,'').replace(/（.*?）/g,''));u.lang='ko-KR';u.rate=.8;if(koVoice)u.voice=koVoice;speechSynthesis.speak(u);
    if(!koVoice&&!warned)setTimeout(()=>{loadVoice();if(!koVoice&&!warned){warned=true;toast('音が出ないときは端末の設定で韓国語の音声を追加してください')}},400)}catch(e){}
}
function confetti(x,y,n=14){
  const em=['★','♥','✿','●','▲','한','글'],cl=['--pink','--yellow','--mint','--sky','--purple','--orange'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=em[i%em.length];
    s.style.left=x+'px';s.style.top=y+'px';s.style.color=`var(${cl[i%cl.length]})`;
    const a=Math.random()*Math.PI*2,d=60+Math.random()*120;s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d-40+'px');s.style.setProperty('--r',(Math.random()*360-180)+'deg');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1100)}
}

function pLearn(l){

function pCards(l){

  <div class="dots">${ws.map((x,j)=>`<i class="${j===f.i?'on':''} ${f.got.has(x.k)?'got':''}"></i>`).join('')}</div>

}
function pQuiz(l){
  const q=qState;
  if(q.i>=l.quiz.length){
    const n=l.quiz.length,s=q.score,st=s===n?3:s>=n*.6?2:1;
    return `<div class="qwrap"><div class="card result"><div class="stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div><div class="sc">${s}<span style="font-size:32px"> / ${n}</span></div><p>${s===n?'パーフェクト！すごい！':s>=n*.6?'よくできました！':'もう一度チャレンジしよう！'}</p>
      <div class="btns">${l.no<L.length?`<a href="#/l/${l.no+1}" class="btn pink block">第${l.no+1}回へすすむ →</a>`:`<a href="#/" class="btn pink block">ステップ0 修了！ホームへ</a>`}<button class="btn block" id="qRetry">もう一度</button><a href="#/l/${l.no}/cards" class="btn block">単語カードで復習</a></div></div></div>`;
  }
  const it=l.quiz[q.i],ans=q.ans;
  return `<div class="qwrap"><div class="qhead"><div class="bar"><i style="width:${q.i/l.quiz.length*100}%"></i></div><b>${q.i+1} / ${l.quiz.length}</b></div>
    <div class="card qcard"><span class="qn">Q${q.i+1}</span><div class="qq">${esc(it.q)}</div>
    <div class="opts">${it.o.map((o,j)=>{let c='';if(ans!=null){c=j===it.a?'ok':j===ans?'ng':'dim'}return `<button class="opt ${c}" data-j="${j}" ${ans!=null?'disabled':''}${isKo(o)?' lang="ko"':''}><span class="l">${'ABC'[j]}</span>${esc(o)}</button>`}).join('')}</div>
    ${ans!=null?`<div class="fb ${ans===it.a?'ok':'ng'}"><b>${ans===it.a?'せいかい！ 정답!':'ざんねん… 아쉬워요'}</b>${esc(it.e)}</div><button class="btn pink block" id="qNext" style="margin-top:14px">${q.i+1<l.quiz.length?'次の問題 →':'結果を見る →'}</button>`:''}
    </div></div>`;
}
function bindLesson(no,tab){
  const l=L.find(x=>x.no===no);
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say,b));
  const ab=$('#ansBtn');if(ab)ab.onclick=()=>{const s=$('#sheet');s.classList.toggle('show-ans');ab.textContent=s.classList.contains('show-ans')?'答えを隠す':'答えを表示'};
  if(tab==='cards'&&$('#fc')){
    const ws=words(l),f=fcState;
    const re=()=>{const y=scrollY;$('.panel').innerHTML=pCards(l);bindLesson(no,tab);scrollTo(0,y)};
    const go=d=>{f.i=(f.i+d+ws.length)%ws.length;f.flip=false;re();say(ws[f.i].k)};
    const fc=$('#fc');fc.onclick=()=>{f.flip=!f.flip;fc.classList.toggle('flip',f.flip);if(!f.flip)say(ws[f.i].k)};
    let sx=null;fc.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
    fc.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>50){e.preventDefault();go(dx<0?1:-1)}});
    $('#fPrev').onclick=()=>go(-1);$('#fNext').onclick=()=>go(1);
    $('#fSay').onclick=e=>say(ws[f.i].k,e.currentTarget);
    $('#fGot').onclick=e=>{const k=ws[f.i].k;if(f.got.has(k))f.got.delete(k);else{f.got.add(k);const r=e.currentTarget.getBoundingClientRect();confetti(r.left+r.width/2,r.top,8);if(f.got.size===ws.length)toast('全部覚えた！クイズに挑戦しよう 🎉')}store.set('got-'+no,[...f.got]);if(!f.got.has(k))re();else setTimeout(()=>go(1),250)};
  }
  if(tab==='quiz'){
    const q=qState;
    document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      const j=+o.dataset.j,it=l.quiz[q.i];q.ans=j;if(j===it.a){q.score++;const r=o.getBoundingClientRect();confetti(r.left+r.width/2,r.top+r.height/2)}
      if(isKo(it.o[it.a]))say(it.o[it.a]);
      $('.panel').innerHTML=pQuiz(l);bindLesson(no,tab);const nb=$('#qNext');if(nb)nb.scrollIntoView({block:'nearest',behavior:'smooth'})});
    const nb=$('#qNext');if(nb)nb.onclick=()=>{q.i++;q.ans=null;if(q.i>=l.quiz.length&&!done.includes(no)){done.push(no);store.set('done',done)}
      $('.panel').innerHTML=pQuiz(l);bindLesson(no,tab);scrollTo({top:0,behavior:'smooth'});
      if(q.i>=l.quiz.length){setTimeout(()=>{const r=$('.result');if(r){const b=r.getBoundingClientRect();confetti(b.left+b.width/2,b.top+80,26)}},250);
        const seg=document.querySelector('.seg a[href$="/quiz"] i');if(seg)seg.textContent='✓'}};
    const rb=$('#qRetry');if(rb)rb.onclick=()=>{qState={i:0,score:0,ans:null};$('.panel').innerHTML=pQuiz(l);bindLesson(no,tab)};
  }
}

  if(l.sheet)p1+=sec('テ','小テストのはんい',`<div class="cols">${l.sheet.slice(0,2).map(s=>`<div><b style="font-size:9.5pt">${s.t}</b><div class="tts">${s.items.map(x=>`<span>${esc(x[0])}</span>`).join('')}</div></div>`).join('')}</div>`);
  p2+=sec('点','ここがポイント',`<table class="pt2"><tbody>${l.points.map(p=>`<tr><th style="width:38mm">${esc(p[0])}</th><td>${esc(p[1])}</td></tr>`).join('')}</tbody></table>`);
  const ws=words(l);if(ws.length)p2+=sec('語','今日の単語',`<table class="pt2"><tbody>${ws.reduce((a,w,i)=>{if(i%2===0)a.push([]);a.at(-1).push(w);return a},[]).map(r=>`<tr>${r.map(w=>`<td class="ko" style="width:28mm">${esc(w.k)}</td><td>${w.p?`［<span class="ko2">${esc(w.p)}</span>］`:''}${esc(w.m)}</td>`).join('')}${r.length<2?'<td></td><td></td>':''}</tr>`).join('')}</tbody></table>`,'アプリでタップすると音声が聞けます');
  p2+=sec('宿','今週の宿題',`<ul class="chk">${l.homework.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  p2+=sec('メ','メモ',`<div style="border:1.5px solid #1d1a2e;border-radius:8px;height:40mm;background:repeating-linear-gradient(#fff 0 9mm,#e3dfe8 9mm calc(9mm + 1px))"></div>`);
  return [p1,p2];
}
function docWork(l){
  const ws=words(l),tr=traceItems(l);let p1=pageHead(l,'ワーク','m','ワークシート',l.sub),p2='',key=[];
  const trR=tr.slice(0,l.letters?11:8);
  p1+=sec('1','なぞって書こう',`<div class="trace">${trR.map(t=>`<div class="lb">${esc(t.lb)}</div><div class="t1">${esc(t.k)}</div><div class="t2">${esc(t.k)}</div><div class="t2">${esc(t.k)}</div><div></div><div></div><div></div>`).join('')}</div>`,'1マス目はお手本、うすい字をなぞってから自分で書こう');
  if(l.letters&&tr.length>11)p2+=sec('1','なぞって書こう（つづき）',`<div class="trace">${tr.slice(11).map(t=>`<div class="lb">${esc(t.lb)}</div><div class="t1">${esc(t.k)}</div><div class="t2">${esc(t.k)}</div><div class="t2">${esc(t.k)}</div><div></div><div></div><div></div>`).join('')}</div>`);
  let n=2;
  if(l.table){
    let bi=0;const body=l.table.rows.map((r,ri)=>`<tr>${r.map((c,k)=>{if(tableKo(l,r,c,k)&&(ri*7+k*3)%5<2){bi++;key.push(['表 '+bi,c]);return `<td class="c blank"><span style="font-size:7pt;color:#8d88a0">${bi}</span></td>`}return `<td class="${tableKo(l,r,c,k)?'c ko':''}">${esc(c)}</td>`}).join('')}</tr>`).join('');
    p2+=sec(n++,'表を完成させよう',`<table class="pt2"><thead><tr>${l.table.cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`,'空いているマスをハングルでうめよう');
  }
  if(ws.length>=4){
    const m=ws.slice(0,Math.min(6,ws.length)),sh=m.map((_,i)=>m[(i*5+2)%m.length]);
    const seen=new Set(),shu=[];sh.concat(m).forEach(w=>{if(!seen.has(w.k)){seen.add(w.k);shu.push(w)}});
    p2+=sec(n++,'線でむすぼう',`<div class="match">${m.map((w,i)=>`<div class="l">${esc(w.k)}<span class="dot"></span></div><div></div><div class="r"><span class="dot"></span>${esc(shu[i].m)}</div>`).join('')}</div>`,'韓国語と意味を線でつなごう');
    m.forEach(w=>key.push(['線',w.k+' — '+w.m]));
  }
  const lis=ws.length?[1,3,5,7,9,0].map(i=>ws[i%ws.length]).filter((w,i,a)=>a.findIndex(x=>x.k===w.k)===i).slice(0,5):[];
  if(lis.length){p2+=sec(n++,'聞いて書こう',`<div class="lines">${lis.map((w,i)=>`<div class="ln"><span class="n">${i+1}</span><span style="border-bottom:0"></span><span class="a">意味：＿＿＿＿＿＿</span></div>`).join('')}</div>`,'先生が読む単語をハングルで書こう');
    lis.forEach((w,i)=>key.push(['聞き'+(i+1),w.k+'（'+w.m+'）']))}
  p2+=sec(n++,'今日のふりかえり',`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:9.5pt"><div style="border:1.5px solid #1d1a2e;border-radius:8px;padding:6px 10px;height:22mm">できたこと</div><div style="border:1.5px solid #1d1a2e;border-radius:8px;padding:6px 10px;height:22mm">むずかしかったこと</div></div>`);
  const p3=`<div class="ph"><span class="badge m">解答</span><h1>第${l.no}回 ワークシート 解答<small>先生用 · 聞き取りの読み上げリストつき</small></h1></div><div class="keyl">${key.map(k=>`<div>${esc(k[0])}：<b>${esc(k[1])}</b></div>`).join('')}</div>`;
  return [p1,p2.startsWith('<div class="ph"')?p2:pageHead(l,'ワーク','m','ワークシート（つづき）','',false)+p2,{key:p3}];
}
function docHw(l){
  const ws=words(l),tr=traceItems(l),h=Math.ceil(ws.length/2);let p1=pageHead(l,'宿題','','宿題プリント',l.sub),p2=pageHead(l,'宿題','','宿題プリント（つづき）','',false),key=[];
  p1+=sec('1','書いて覚えよう',`<div class="boxes">${tr.slice(0,10).map((t,i)=>`<div>${i+1}. ${esc(t.lb)}</div>`).join('')}</div>`,'左上のヒントを見て、ハングルを書こう（答えは最後のページ）');
  if(ws.length){
    p1+=sec('2','意味を書こう',`<div class="lines">${ws.slice(0,h).map((w,i)=>`<div class="ln"><span class="n">${i+1}</span><span class="q">${esc(w.k)}</span><span class="a">意味：＿＿＿＿＿＿＿＿</span></div>`).join('')}</div>`);
    ws.slice(0,h).forEach((w,i)=>key.push(['2-'+(i+1),w.k+' ＝ '+w.m]));
    p1+=sec('3','ハングルで書こう',`<div class="lines">${ws.slice(h).map((w,i)=>`<div class="ln"><span class="n">${i+1}</span><span>${esc(w.m)}</span><span class="a">ハングル：＿＿＿＿＿＿＿＿</span></div>`).join('')}</div>`);
    ws.slice(h).forEach((w,i)=>key.push(['3-'+(i+1),w.m+' ＝ '+w.k]));
  }
  p2+=sec('4','クイズ',`<div class="mcq">${l.quiz.map((q,i)=>`<div><b>Q${i+1}</b><span>${esc(q.q)}</span><span class="o">${q.o.map(o=>`<span class="${isKo(o)?'ko2':''}">${esc(o)}</span>`).join('')}</span></div>`).join('')}</div>`,'正しいものに○をつけよう');
  l.quiz.forEach((q,i)=>key.push(['Q'+(i+1),q.o[q.a]+' — '+q.e]));
  p2+=sec('5','今週の宿題',`<ul class="chk">${l.homework.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`);
  p2+=sec('6','音読チェック',`<div class="week">${['月','火','水','木','金','土','日'].map(d=>`<div class="h">${d}</div>`).join('')}${'<div class="c"></div>'.repeat(7)}</div>`,'音読したらシールか○を書こう');
  p2+=sec('7','先生から',`<div style="border:1.5px solid #1d1a2e;border-radius:8px;height:24mm"></div>`);
  const p3=`<div class="ph"><span class="badge m">解答</span><h1>第${l.no}回 宿題プリント 解答<small>答え合わせ用</small></h1></div><div class="keyl">${tr.slice(0,10).map((t,i)=>`<div>1-${i+1}：<b>${esc(t.k)}</b></div>`).join('')}${key.map(k=>`<div>${esc(k[0])}：<b>${esc(k[1])}</b></div>`).join('')}</div>`;
  return [p1,p2,{key:p3}];
}
function vPrint(no,t){
  const l=L.find(x=>x.no===no)||L[0],d=DOCS.find(x=>x[0]===t)||DOCS[0];t=d[0];
  const parts=(t==='work'?docWork:t==='hw'?docHw:t==='guide'?docGuide:docText)(l);
  const pages=parts.map((p,i)=>typeof p==='string'?`<section class="page">${p}${pfoot(l,d[1],(i+1)+'/'+parts.length,t==='guide')}</section>`:`<section class="page key">${p.key}${pfoot(l,d[1]+' 解答',(i+1)+'/'+parts.length)}</section>`).join('');
  return `<div class="ptool"><a href="#/l/${l.no}" class="btn">← 戻る</a><b>${t==='guide'?`제${l.no}회 `:`第${l.no}回 `}${d[1]}</b><a class="btn" href="${pdfUrl(l.no,t)}" download>⬇ PDF</a><button class="btn pink" id="pBtn">🖨 印刷</button></div><div class="pages">${pages}</div>`;
}

/* ---------- router ---------- */
function route(){const h=location.hash.replace(/^#\/?/,'').split('/');
  if(h[0]==='l'&&h[1])return {v:'lesson',no:+h[1],tab:['learn','cards','quiz'].includes(h[2])?h[2]:'learn'};
  if(h[0]==='print'&&h[1])return {v:'print',no:+h[1],t:h[2]||'text'};
  if(h[0]==='words')return {v:'words'};if(h[0]==='guide')return {v:'guide'};return {v:'home'}}
let last='';
function render(){
  const r=route(),key=JSON.stringify(r);closeSheet();
  if(r.v==='lesson'){
    if(!last.includes(`"no":${r.no},`)||!last.includes('lesson'))fcState={i:0,flip:false,got:new Set(store.get('got-'+r.no,[]))};
    if(r.tab==='quiz'&&(!qState||qState.no!==r.no||!last.includes('quiz')))qState={no:r.no,i:0,score:0,ans:null};
  }
  document.body.classList.toggle('pmode',r.v==='print');
  const html=r.v==='print'?vPrint(r.no,r.t):r.v==='lesson'?vLesson(r.no,r.tab):r.v==='words'?vWords():r.v==='guide'?vGuide():vHome();
  $('#app').innerHTML=r.v==='print'?html:`<div class="view">${html}</div>`;
  if(r.v==='print'){setTabs(null);const pb=$('#pBtn');if(pb)pb.onclick=()=>print()}
  else if(r.v==='lesson')bindLesson(r.no,r.tab);else if(r.v==='words')bindWords();else if(r.v==='home')bindHome();
  if(key!==last)scrollTo(0,0);last=key;
}
addEventListener('hashchange',render);
render();

/* ---------- theme ---------- */
const root=document.documentElement;
{const t=store.get('theme',null);if(t)root.dataset.theme=t}
function toggleTheme(){const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;root.dataset.theme=dark?'light':'dark';store.set('theme',root.dataset.theme);
  document.querySelector('meta[name="theme-color"]').content=dark?'#fff4e2':'#1c1631'}

/* ---------- PWA ---------- */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
